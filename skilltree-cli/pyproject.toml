[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skilltree"
version = "0.1.0"
description = "Single-user, offline skill-tree learning CLI (Milestone 1)"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["typer>=0.12", "PyYAML>=6", "fsrs>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
skilltree = "skilltree.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skilltree = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
